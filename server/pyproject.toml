[project]
name = "ecos-server"
version = "0.1.0"
description = "ecos 电商 Agent 平台后端（共享底座 + 交易域 + 内容域占位，基于 AgentScope 2.x）"
requires-python = ">=3.12"
dependencies = [
    "agentscope>=2.0.8,<2.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0.2",
    "cryptography>=43",
    "httpx>=0.27",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ecos*"]

[tool.setuptools.package-data]
ecos = ["connectors/catalog.d/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "external: 需要真实外网访问的源冒烟（默认跳过）",
]
addopts = "-m 'not external'"
filterwarnings = [
    # 测试密钥 11 字节触发 PyJWT 短密钥告警；生产守护已由 validate_runtime 把关
    "ignore::jwt.warnings.InsecureKeyLengthWarning",
]
